name: Build Android Project - Manual Trigger

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - master
          - dev
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_cache:
        description: 'Clean cache before build?'
        required: true
        default: 'true'
        type: boolean

  # Juga bisa trigger otomatis untuk branch tertentu
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      CLEAN_CACHE: ${{ github.event.inputs.clean_cache || 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Free up disk space
        run: |
          echo "Cleaning up disk space..."
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: telegram-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Build Command
        run: |
          echo "Building branch: $BRANCH"
          echo "Build type: $BUILD_TYPE"
          echo "Clean cache: $CLEAN_CACHE"
          
          # Run docker with increased memory and disk space
          docker run --rm \
            -v "$PWD":/home/source \
            --memory="4g" \
            --swap="2g" \
            telegram-build:latest

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            TMessagesProj/build/outputs/apk/
            TMessagesProj/build/outputs/bundle/
          retention-days: 7

      - name: Show Build Results
        if: always()
        run: |
          echo "Build completed with status: ${{ job.status }}"
          ls -la TMessagesProj/build/outputs/ || echo "No outputs directory"
