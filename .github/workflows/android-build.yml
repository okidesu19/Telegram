name: Android Build with Docker

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        tags: telegram-build:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Android build in container
      run: |
        docker run \
          --rm \
          --workdir /home/gradle \
          --memory=8g \
          --memory-swap=8g \
          --cpus=4 \
          -v "$PWD":/home/source \
          telegram-build:latest

    - name: List build outputs
      run: |
        echo "Build outputs:"
        find . -name "*.apk" -o -name "*.aab" | head -20
        du -sh TMessagesProj/build/outputs/ || true

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apks
        path: |
          TMessagesProj/build/outputs/apk/**/*.apk
        retention-days: 7

    - name: Upload AAB artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-aabs
        path: |
          TMessagesProj/build/outputs/bundle/**/*.aab
        retention-days: 7

    - name: Upload native debug symbols
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: native-debug-symbols
        path: |
          TMessagesProj/build/outputs/native-debug-symbols/**/*
        retention-days: 7

    - name: Clean up Docker
      run: |
        docker system prune -a -f
        sudo rm -rf /tmp/*

    - name: Notify success
      if: success()
      run: |
        echo "✅ Build completed successfully!"
        echo "Artifacts available in the artifacts section"

    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Build failed!"
        exit 1
