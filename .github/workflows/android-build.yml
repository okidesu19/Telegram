name: Build Android Project

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 

    strategy:
      matrix:
        module: ["TMessagesProj_App:assembleAfatRelease", "TMessagesProj_AppHuawei:assembleAfatRelease", "TMessagesProj_AppStandalone:assembleAfatStandalone"]
      fail-fast: false  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          lfs: false

      - name: Free up disk space
        run: |
          echo "🧹 Cleaning disk space..."
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h
        

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/android-sdk-linux
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build --cache-from=type=inline --cache-to=type=inline -t telegram-build .

      - name: Run Build Command
        run: |
          echo "🚀 Building ${{ matrix.module }}..."
          docker run --rm -v "$PWD":/home/gradle -w /home/gradle telegram-build ./gradlew clean ${{ matrix.module }} --stacktrace --info

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs-${{ matrix.module }}
          path: |
            TMessagesProj/build/outputs/apk/
            TMessagesProj/build/outputs/bundle/
            TMessagesProj/build/outputs/native-debug-symbols/
          retention-days: 7

      - name: Show build summary
        if: always()
        run: |
          echo "📊 Build status: ${{ job.status }}"
          echo "📁 Output directory contents:"
          ls -la TMessagesProj/build/outputs/ || echo "No outputs found"
