name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        mkdir -p /usr/local/android-sdk-linux
        cd /usr/local/android-sdk-linux
        ANDROID_SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip"
        curl -o sdk.zip $ANDROID_SDK_URL
        unzip sdk.zip
        rm sdk.zip
        yes | ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
        ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --update
        ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME \
          "build-tools;30.0.3" \
          "build-tools;34.0.0" \
          "platforms;android-34" \
          "platform-tools" \
          "ndk;21.4.7075529"
        sudo cp $ANDROID_HOME/build-tools/30.0.3/dx $ANDROID_HOME/build-tools/34.0.0/dx
        sudo cp $ANDROID_HOME/build-tools/30.0.3/lib/dx.jar $ANDROID_HOME/build-tools/34.0.0/lib/dx.jar
      env:
        ANDROID_HOME: /usr/local/android-sdk-linux

    - name: Setup environment variables
      run: |
        echo "ANDROID_HOME=/usr/local/android-sdk-linux" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/android-sdk-linux/ndk/21.4.7075529" >> $GITHUB_ENV
        echo "PATH=$PATH:/usr/local/android-sdk-linux/tools:/usr/local/android-sdk-linux/platform-tools:/usr/local/android-sdk-linux/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.6'

    - name: Build bundleBundleAfat_SDK23Release
      run: ./gradlew :TMessagesProj_App:bundleBundleAfat_SDK23Release
      env:
        ANDROID_HOME: /usr/local/android-sdk-linux
        ANDROID_NDK_HOME: /usr/local/android-sdk-linux/ndk/21.4.7075529

    - name: Upload bundleBundleAfat_SDK23Release
      uses: actions/upload-artifact@v4
      with:
        name: bundle-sdk23-release
        path: TMessagesProj_App/build/outputs/

    - name: Build bundleBundleAfatRelease
      run: ./gradlew :TMessagesProj_App:bundleBundleAfatRelease
      env:
        ANDROID_HOME: /usr/local/android-sdk-linux
        ANDROID_NDK_HOME: /usr/local/android-sdk-linux/ndk/21.4.7075529

    - name: Upload bundleBundleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: bundle-afat-release
        path: TMessagesProj_App/build/outputs/

    - name: Build assembleAfatStandalone
      run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone
      env:
        ANDROID_HOME: /usr/local/android-sdk-linux
        ANDROID_NDK_HOME: /usr/local/android-sdk-linux/ndk/21.4.7075529

    - name: Upload assembleAfatStandalone
      uses: actions/upload-artifact@v4
      with:
        name: afat-standalone
        path: TMessagesProj_AppStandalone/build/outputs/

    - name: Build assembleAfatRelease
      run: ./gradlew :TMessagesProj_App:assembleAfatRelease
      env:
        ANDROID_HOME: /usr/local/android-sdk-linux
        ANDROID_NDK_HOME: /usr/local/android-sdk-linux/ndk/21.4.7075529

    - name: Upload assembleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: afat-release
        path: TMessagesProj_App/build/outputs/

    - name: Build Huawei assembleAfatRelease
      run: ./gradlew :TMessagesProj_AppHuawei:assembleAfatRelease
      env:
        ANDROID_HOME: /usr/local/android-sdk-linux
        ANDROID_NDK_HOME: /usr/local/android-sdk-linux/ndk/21.4.7075529

    - name: Upload Huawei assembleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: huawei-afat-release
        path: TMessagesProj_AppHuawei/build/outputs/
