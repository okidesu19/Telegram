name: Build Android Project

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      matrix:
        module: [
          "TMessagesProj_App:bundleBundleAfat_SDK23Release",
          "TMessagesProj_App:bundleBundleAfatRelease",
          "TMessagesProj_AppStandalone:assembleAfatStandalone",
          "TMessagesProj_App:assembleAfatRelease",
          "TMessagesProj_AppHuawei:assembleAfatRelease"
        ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          lfs: false

      - name: Free up disk space
        run: |
          echo "🧹 Cleaning disk space..."
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/android-sdk-linux
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build --cache-from=type=inline --cache-to=type=inline -t telegram-build .

      - name: Run Build Command
        run: |
          echo "🚀 Building ${{ matrix.module }}..."
          docker run --rm -v "$PWD":/home/gradle -w /home/gradle telegram-build /bin/sh -c "\
            mkdir -p /home/source/TMessagesProj/build/outputs/apk && \
            mkdir -p /home/source/TMessagesProj/build/outputs/bundle && \
            mkdir -p /home/source/TMessagesProj/build/outputs/native-debug-symbols && \
            cp -R /home/gradle/. /home/source && \
            ./gradlew ${{ matrix.module }} --stacktrace --info && \
            cp -R /home/gradle/TMessagesProj_App/build/outputs/* /home/source/TMessagesProj/build/outputs/ 2>/dev/null || true && \
            cp -R /home/gradle/TMessagesProj_AppHuawei/build/outputs/* /home/source/TMessagesProj/build/outputs/ 2>/dev/null || true && \
            cp -R /home/gradle/TMessagesProj_AppStandalone/build/outputs/* /home/source/TMessagesProj/build/outputs/ 2>/dev/null || true"

      - name: Debug Output Directory
        run: |
          echo "📁 Checking output directories..."
          ls -la TMessagesProj/build/outputs/ || echo "No outputs in TMessagesProj/build/outputs/"
          ls -la TMessagesProj_App/build/outputs/ || echo "No outputs in TMessagesProj_App/build/outputs/"
          ls -la TMessagesProj_AppHuawei/build/outputs/ || echo "No outputs in TMessagesProj_AppHuawei/build/outputs/"
          ls -la TMessagesProj_AppStandalone/build/outputs/ || echo "No outputs in TMessagesProj_AppStandalone/build/outputs/"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs-${{ matrix.module }}
          path: |
            TMessagesProj/build/outputs/
            TMessagesProj_App/build/outputs/
            TMessagesProj_AppHuawei/build/outputs/
            TMessagesProj_AppStandalone/build/outputs/
          retention-days: 7

      - name: Show build summary
        if: always()
        run: |
          echo "📊 Build status: ${{ job.status }}"
          echo "📁 Final output directory contents:"
          ls -la TMessagesProj/build/outputs/ || echo "No outputs found"
