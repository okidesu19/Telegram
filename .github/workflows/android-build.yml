name: Build Android Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the code repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the Docker image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: telegram-build:latest
          cache-from: type=gha

      # Run the build command using the built image
      - name: Run Build Command
        run: |
          docker run --rm -v "$PWD":/home/source telegram-build:latest
