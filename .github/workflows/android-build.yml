name: Android Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip curl

    - name: Setup Android SDK
      run: |
        # Create Android SDK directory
        mkdir -p ~/android-sdk
        cd ~/android-sdk
        
        # Download and extract Android Command Line Tools
        ANDROID_SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip"
        curl -o commandlinetools.zip $ANDROID_SDK_URL
        unzip commandlinetools.zip -d cmdline-tools
        rm commandlinetools.zip
        
        # Move to correct structure
        mv cmdline-tools/cmdline-tools cmdline-tools/latest
        
        # Set environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/21.4.7075529" >> $GITHUB_ENV
        echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

    - name: Accept Android licenses
      run: |
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install Android packages
      run: |
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "cmdline-tools;latest"
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --update
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "build-tools;30.0.3" \
          "build-tools;34.0.0" \
          "platforms;android-34" \
          "platform-tools" \
          "ndk;21.4.7075529" \
          "cmake;3.22.1"

    - name: Copy dx files (if needed)
      run: |
        # Check if files exist before copying
        if [ -f "$ANDROID_HOME/build-tools/30.0.3/dx" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
          cp $ANDROID_HOME/build-tools/30.0.3/dx $ANDROID_HOME/build-tools/34.0.0/dx
        fi
        if [ -f "$ANDROID_HOME/build-tools/30.0.3/lib/dx.jar" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0/lib" ]; then
          cp $ANDROID_HOME/build-tools/30.0.3/lib/dx.jar $ANDROID_HOME/build-tools/34.0.0/lib/dx.jar
        fi

    - name: Create local.properties file
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        echo "Created local.properties:"
        cat local.properties

    - name: Verify Android installation
      run: |
        echo "Android Home: $ANDROID_HOME"
        echo "Android SDK Root: $ANDROID_SDK_ROOT"
        echo "Android NDK Home: $ANDROID_NDK_HOME"
        echo "PATH: $PATH"
        ls -la $ANDROID_HOME
        ls -la $ANDROID_HOME/build-tools/
        ls -la $ANDROID_HOME/platforms/

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.6'

    - name: Create output directories
      run: |
        mkdir -p TMessagesProj/build/outputs/apk
        mkdir -p TMessagesProj/build/outputs/bundle
        mkdir -p TMessagesProj/build/outputs/native-debug-symbols

    - name: Build bundleBundleAfat_SDK23Release
      run: |
        ./gradlew :TMessagesProj_App:bundleBundleAfat_SDK23Release --no-daemon --stacktrace
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload bundleBundleAfat_SDK23Release
      uses: actions/upload-artifact@v4
      with:
        name: bundle-sdk23-release
        path: |
          TMessagesProj_App/build/outputs/
          TMessagesProj/build/outputs/
        if-no-files-found: warn

    - name: Build bundleBundleAfatRelease
      run: |
        ./gradlew :TMessagesProj_App:bundleBundleAfatRelease --no-daemon --stacktrace
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload bundleBundleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: bundle-afat-release
        path: |
          TMessagesProj_App/build/outputs/
          TMessagesProj/build/outputs/
        if-no-files-found: warn

    - name: Build assembleAfatStandalone
      run: |
        ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload assembleAfatStandalone
      uses: actions/upload-artifact@v4
      with:
        name: afat-standalone
        path: |
          TMessagesProj_AppStandalone/build/outputs/
          TMessagesProj/build/outputs/
        if-no-files-found: warn

    - name: Build assembleAfatRelease
      run: |
        ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload assembleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: afat-release
        path: |
          TMessagesProj_App/build/outputs/
          TMessagesProj/build/outputs/
        if-no-files-found: warn

    - name: Build Huawei assembleAfatRelease
      run: |
        ./gradlew :TMessagesProj_AppHuawei:assembleAfatRelease --no-daemon --stacktrace
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload Huawei assembleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: huawei-afat-release
        path: |
          TMessagesProj_AppHuawei/build/outputs/
          TMessagesProj/build/outputs/
        if-no-files-found: warn

    - name: Final artifacts summary
      run: |
        echo "=== Build Artifacts Summary ==="
        echo "APK files:"
        find . -name "*.apk" -exec ls -la {} \;
        echo ""
        echo "AAB files:"
        find . -name "*.aab" -exec ls -la {} \;
        echo ""
        echo "Output directories:"
        find . -name "outputs" -type d -exec ls -la {} \;
        echo "=============================="
