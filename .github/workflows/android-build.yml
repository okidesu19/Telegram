name: Android Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Check disk space
      run: |
        df -h
        du -sh /home/runner/* | sort -hr

    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip curl

    - name: Setup Android SDK with minimal packages
      run: |
        # Create Android SDK directory
        mkdir -p ~/android-sdk
        cd ~/android-sdk
        
        # Download and extract Android Command Line Tools
        ANDROID_SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip"
        curl -o commandlinetools.zip $ANDROID_SDK_URL
        unzip commandlinetools.zip -d cmdline-tools
        rm commandlinetools.zip
        
        # Move to correct structure
        mv cmdline-tools/cmdline-tools cmdline-tools/latest
        
        # Set environment variables
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/21.4.7075529" >> $GITHUB_ENV
        echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

    - name: Accept Android licenses
      run: |
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install only essential Android packages
      run: |
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "cmdline-tools;latest"
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "build-tools;34.0.0" \
          "platforms;android-34" \
          "platform-tools" \
          "ndk;21.4.7075529"

    - name: Clean up unnecessary SDK files
      run: |
        # Remove unnecessary files to save space
        rm -rf $HOME/android-sdk/cmdline-tools/latest/NOTICE.txt
        rm -rf $HOME/android-sdk/cmdline-tools/latest/lib/*.jar
        find $HOME/android-sdk -name "*.txt" -delete
        find $HOME/android-sdk -name "*.md" -delete

    - name: Create local.properties file
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        echo "Created local.properties:"
        cat local.properties

    - name: Setup Gradle with caching
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.6'
        cache-disabled: false
        cache-read-only: false

    - name: Clean project before build
      run: |
        ./gradlew clean --no-daemon

    - name: Build bundleBundleAfat_SDK23Release
      run: |
        ./gradlew :TMessagesProj_App:bundleBundleAfat_SDK23Release --no-daemon --stacktrace --console=plain
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload bundleBundleAfat_SDK23Release
      uses: actions/upload-artifact@v4
      with:
        name: bundle-sdk23-release
        path: |
          TMessagesProj_App/build/outputs/bundle/
        if-no-files-found: warn

    - name: Clean after first build
      run: |
        # Clean intermediate files to free up space
        ./gradlew clean --no-daemon
        rm -rf ~/.gradle/caches/transforms-*/
        rm -rf ~/.gradle/caches/jars-*/
        df -h

    - name: Build bundleBundleAfatRelease
      run: |
        ./gradlew :TMessagesProj_App:bundleBundleAfatRelease --no-daemon --stacktrace --console=plain
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload bundleBundleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: bundle-afat-release
        path: |
          TMessagesProj_App/build/outputs/bundle/
        if-no-files-found: warn

    - name: Clean after second build
      run: |
        ./gradlew clean --no-daemon
        rm -rf ~/.gradle/caches/transforms-*/
        rm -rf ~/.gradle/caches/jars-*/
        df -h

    - name: Build assembleAfatStandalone
      run: |
        ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace --console=plain
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload assembleAfatStandalone
      uses: actions/upload-artifact@v4
      with:
        name: afat-standalone
        path: |
          TMessagesProj_AppStandalone/build/outputs/apk/
        if-no-files-found: warn

    - name: Clean after third build
      run: |
        ./gradlew clean --no-daemon
        rm -rf ~/.gradle/caches/transforms-*/
        rm -rf ~/.gradle/caches/jars-*/
        df -h

    - name: Build assembleAfatRelease
      run: |
        ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace --console=plain
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload assembleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: afat-release
        path: |
          TMessagesProj_App/build/outputs/apk/
        if-no-files-found: warn

    - name: Clean after fourth build
      run: |
        ./gradlew clean --no-daemon
        rm -rf ~/.gradle/caches/transforms-*/
        rm -rf ~/.gradle/caches/jars-*/
        df -h

    - name: Build Huawei assembleAfatRelease
      run: |
        ./gradlew :TMessagesProj_AppHuawei:assembleAfatRelease --no-daemon --stacktrace --console=plain
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROID_SDK_ROOT: $HOME/android-sdk
        ANDROID_NDK_HOME: $HOME/android-sdk/ndk/21.4.7075529

    - name: Upload Huawei assembleAfatRelease
      uses: actions/upload-artifact@v4
      with:
        name: huawei-afat-release
        path: |
          TMessagesProj_AppHuawei/build/outputs/apk/
        if-no-files-found: warn

    - name: Final cleanup
      run: |
        df -h
        du -sh ~/.gradle/ ~/android-sdk/ | sort -hr

    - name: Final artifacts summary
      run: |
        echo "=== Build Artifacts Summary ==="
        echo "APK files:"
        find . -name "*.apk" -exec ls -la {} \; 2>/dev/null || true
        echo ""
        echo "AAB files:"
        find . -name "*.aab" -exec ls -la {} \; 2>/dev/null || true
        echo "=============================="
