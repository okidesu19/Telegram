name: Build Android Project

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          submodules: true 
          lfs: false  

      - name: Free up disk space
        run: |
          echo "🧹 Cleaning disk space..."
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android/sdk/emulator/
          sudo rm -rf /usr/local/lib/android/sdk/system-images/
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t telegram-build .

      - name: Run Build Command with increased resources
        run: |
          echo "🚀 Starting build process..."
          docker run --rm -v "$PWD":/home/gradle/ -w /home/gradle telegram-build gradle assembleRelease 

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: |
            TMessagesProj/build/outputs/apk/
            TMessagesProj/build/outputs/bundle/
          retention-days: 7

      - name: Show build summary
        if: always()
        run: |
          echo "📊 Build status: ${{ job.status }}"
          echo "📁 Output directory contents:"
          ls -la TMessagesProj/build/outputs/ || echo "No outputs found"
