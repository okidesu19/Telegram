name: Build Android Project
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: /usr/local/android-sdk-linux
          key: android-sdk-34

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Android SDK (if not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /usr/local/android-sdk-linux
          cd /usr/local/android-sdk-linux
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip
          unzip sdk.zip
          rm sdk.zip
          mv cmdline-tools cmdline-tools-temp
          mkdir cmdline-tools
          mv cmdline-tools-temp/latest cmdline-tools/
          rmdir cmdline-tools-temp
          sdkmanager="cmdline-tools/latest/bin/sdkmanager"
          yes | $sdkmanager --licenses || true
          $sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" "ndk;21.4.7075529"

      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=/usr/local/android-sdk-linux" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/android-sdk-linux" >> $GITHUB_ENV
          echo "/usr/local/android-sdk-linux/platform-tools" >> $GITHUB_PATH

      - name: Build APKs and Bundles
        run: |
          ./gradlew \
            :TMessagesProj_App:bundleBundleAfat_SDK23Release \
            :TMessagesProj_App:bundleBundleAfatRelease \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            :TMessagesProj_App:assembleAfatRelease \
            :TMessagesProj_AppHuawei:assembleAfatRelease \
            --parallel --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: TMessagesProj_App/build/outputs/
